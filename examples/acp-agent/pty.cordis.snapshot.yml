# Keyless replay counterpart to pty.cordis.yml.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@qilin/llm-deepseek'
        disabled: true
      - insert:
          - id: pty
            name: '@qilin/terminal'
          - id: pty-snapshot-backend
            name: './pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@qilin/tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@qilin/llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
