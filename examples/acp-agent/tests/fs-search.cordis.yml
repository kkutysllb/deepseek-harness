# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@qilin/llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@qilin/subprocess-local'

- id: bash
  name: '@qilin/bash-local'

- id: acp-agent
  name: '@qilin/acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.QILIN_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.QILIN_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@qilin/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
