[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "openkylin-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled qilin CLI runtime for the DeepSeek Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/kkutysllb/OpenKylin"
Documentation = "https://github.com/kkutysllb/OpenKylin/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/kkutysllb/OpenKylin/issues"
Source = "https://github.com/kkutysllb/OpenKylin"

[project.scripts]
openkylin = "openkylin_runtime:main"

# Include the injected qilin executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/openkylin_runtime/runtime/openkylin-sdk-runtime-*"]
exclude = ["src/openkylin_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/openkylin_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
