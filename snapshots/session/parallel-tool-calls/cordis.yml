# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# `qilin-base`, so this patch changes only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@qilin/spill-local'
  config:
    root: !!js process.env.QILIN_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@qilin/spill-policy'
  config:
    maxInlineBytes: !!js process.env.QILIN_SNAPSHOT && 800 || 50000
