# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@qilin/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@qilin/llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@qilin/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.QILIN_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@qilin/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
