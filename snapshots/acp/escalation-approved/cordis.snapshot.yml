# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-deepseek
  name: '@qilin/llm-deepseek'
  disabled: true

- id: acp
  name: '@qilin/acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@qilin/session-persistence-jsonl'
  config:
    root: !!js process.env.OPENKYLIN_SNAPSHOT_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@qilin/sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@qilin/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'
